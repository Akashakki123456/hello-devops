
apiVersion: apps/v1
kind: Deployment

metadata:
  name: hello-devops
  namespace: hello-devops

spec:
  replicas: 3

  selector:
    matchLabels:
      app: hello-devops

  template:
    metadata:
      labels:
        app: hello-devops

    spec:
      containers:
        - name: hello-devops
          image: akashakki123456/hello-devops:v1
          ports:
            - containerPort: 80
